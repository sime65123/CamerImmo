name: camerimmo
description: Plateforme immobilière nouvelle génération pour le Cameroun
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.4

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.1.3

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  lottie: ^2.7.0

  # Charts
  fl_chart: ^0.66.2

  # Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0

  # Images
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0

  # Storage
  path_provider: ^2.1.2
  open_file: ^3.3.2
  share_plus: ^7.2.2
  dio: ^5.4.1

  # WebView
  webview_flutter: ^4.4.4

  # Notifications
  firebase_core: ^2.27.1
  firebase_messaging: ^14.7.20
  flutter_local_notifications: ^16.3.3

  # Utils
  intl: ^0.18.1
  url_launcher: ^6.2.5
  connectivity_plus: ^5.0.2
  flutter_secure_storage: ^9.0.0
  pinput: ^3.0.0
  another_flushbar: ^1.12.30
  timeago: ^3.6.1
  uuid: ^4.3.3
  equatable: ^2.0.5
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700